body {

#code-csp-warning {
	position: fixed;
	top: 0;
	right: 0;
	color: white;
	margin: 16px;
	text-align: center;
	font-size: 12px;
	font-family: sans-serif;
	background-color:#444444;
	cursor: pointer;
	padding: 6px;
	box-shadow: 1px 1px 1px rgba(0,0,0,.25);
}

#code-csp-warning:hover {
	text-decoration: none;
	background-color:#007acc;
	box-shadow: 2px 2px 2px rgba(0,0,0,.25);
}

body.scrollBeyondLastLine {
	margin-bottom: calc(100vh - 22px);
}

body.showEditorSelection .code-line {
	position: relative;
}

body.showEditorSelection .code-active-line:before,
body.showEditorSelection .code-line:hover:before {
	content: "";
	display: block;
	position: absolute;
	top: 0;
	left: -12px;
	height: 100%;
}

body.showEditorSelection li.code-active-line:before,
body.showEditorSelection li.code-line:hover:before {
	left: -30px;
}

.vscode-light.showEditorSelection .code-active-line:before {
	border-left: 3px solid rgba(0, 0, 0, 0.15);
}

.vscode-light.showEditorSelection .code-line:hover:before {
	border-left: 3px solid rgba(0, 0, 0, 0.40);
}

.vscode-light.showEditorSelection .code-line .code-line:hover:before {
	border-left: none;
}

.vscode-dark.showEditorSelection .code-active-line:before {
	border-left: 3px solid rgba(255, 255, 255, 0.4);
}

.vscode-dark.showEditorSelection .code-line:hover:before {
	border-left: 3px solid rgba(255, 255, 255, 0.60);
}

.vscode-dark.showEditorSelection .code-line .code-line:hover:before {
	border-left: none;
}

.vscode-high-contrast.showEditorSelection .code-active-line:before {
	border-left: 3px solid rgba(255, 160, 0, 0.7);
}

.vscode-high-contrast.showEditorSelection .code-line:hover:before {
	border-left: 3px solid rgba(255, 160, 0, 1);
}

.vscode-high-contrast.showEditorSelection .code-line .code-line:hover:before {
	border-left: none;
}

img {
	max-width: 100%;
	max-height: 100%;
}

a {
	text-decoration: none;
}

a:hover {
	text-decoration: underline;
}

a:focus,
input:focus,
select:focus,
textarea:focus {
	outline: 1px solid -webkit-focus-ring-color;
	outline-offset: -1px;
}

hr {
	border: 0;
	height: 2px;
	border-bottom: 2px solid;
}

h1 {
	padding-bottom: 0.3em;
	line-height: 1.2;
	border-bottom-width: 1px;
	border-bottom-style: solid;
}

h1, h2, h3 {
	font-weight: normal;
}

table {
	border-collapse: collapse;
}

table > thead > tr > th {
	text-align: left;
	border-bottom: 1px solid;
}

table > thead > tr > th,
table > thead > tr > td,
table > tbody > tr > th,
table > tbody > tr > td {
	padding: 5px 10px;
}

table > tbody > tr + tr > td {
	border-top: 1px solid;
}

blockquote {
	margin: 0 7px 0 5px;
	padding: 0 16px 0 10px;
	border-left-width: 5px;
	border-left-style: solid;
}

code {
	font-family: Menlo, Monaco, Consolas, "Droid Sans Mono", "Courier New", monospace, "Droid Sans Fallback";
	font-size: 1em;
	line-height: 1.357em;
}

body.wordWrap pre {
	white-space: pre-wrap;
}

pre:not(.hljs),
pre.hljs code > div {
	padding: 16px;
	border-radius: 3px;
	overflow: auto;
}

pre code {
	color: var(--vscode-editor-foreground);
	tab-size: 4;
}

/** Theming */

.vscode-light pre {
	background-color: rgba(220, 220, 220, 0.4);
}

.vscode-dark pre {

}

.vscode-high-contrast pre {

.vscode-high-contrast h1 {

<style>
.u-carousel {
  --u-width: min(1200px, 96vw);
  --u-height: min(72vh, 720px);
  --u-radius: 18px;

  width: var(--u-width);
  margin: 24px auto;
  color: inherit;
  font-family: system-ui, sans-serif;
}

.u-carousel * {
  box-sizing: border-box;
}

.u-carousel__viewer {
  position: relative;
  width: 100%;
  height: var(--u-height);
  background: transparent;
  border-radius: var(--u-radius);
  overflow: hidden;
  border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  box-shadow: 0 12px 40px color-mix(in srgb, currentColor 12%, transparent);
}

.u-carousel__stage {
  position: relative;
  width: 100%;
  height: 100%;
  background: transparent;
}

.u-carousel__item {
  position: absolute;
  inset: 0;
  display: none;
  width: 100%;
  height: 100%;
  background: transparent;
}

.u-carousel__item.is-active {
  display: block;
}

.u-carousel__item img,
.u-carousel__item video {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: contain;
  object-position: center center;
  background: transparent;
}

.u-carousel__iframe-wrap {
  width: 100%;
  height: 100%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.u-carousel__iframe-wrap iframe {
  display: block;
  width: 95%;
  height: 95%;
  border: none;
  background: transparent;
}

.u-carousel__arrow {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 5;
  width: 54px;
  height: 54px;
  border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, currentColor 10%, transparent);
  color: inherit;
  font-size: 28px;
  line-height: 1;
  cursor: pointer;
  backdrop-filter: blur(6px);
}

.u-carousel__arrow:hover {
  background: color-mix(in srgb, currentColor 16%, transparent);
}

.u-carousel__arrow--prev {
  left: 14px;
}

.u-carousel__arrow--next {
  right: 14px;
}

.u-carousel__caption {
  margin-top: 10px;
  padding: 10px 14px;
  border-radius: 12px;
  background: color-mix(in srgb, currentColor 8%, transparent);
  color: inherit;
  font-size: 14px;
  line-height: 1.45;
  border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
}

.u-carousel__caption:empty {
  display: none;
}

.u-carousel__caption a {
  color: inherit;
  text-decoration-line: underline;
  text-decoration-thickness: 1px;
  text-underline-offset: 0.14em;
  text-decoration-skip-ink: auto;
}

.u-carousel__caption a:hover {
  opacity: 0.8;
}

.u-carousel__bottom {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 12px;
}

.u-carousel__counter {
  flex: 0 0 auto;
  min-width: 84px;
  text-align: center;
  font-size: 14px;
  color: color-mix(in srgb, currentColor 72%, transparent);
}

.u-carousel__thumbs {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  flex: 1 1 auto;
}

.u-carousel__thumb {
  flex: 0 0 auto;
  min-width: 40px;
  height: 36px;
  padding: 0 12px;
  border: 1px solid color-mix(in srgb, currentColor 14%, transparent);
  border-radius: 999px;
  background: color-mix(in srgb, currentColor 8%, transparent);
  color: inherit;
  cursor: pointer;
}

.u-carousel__thumb:hover {
  background: color-mix(in srgb, currentColor 12%, transparent);
}

.u-carousel__thumb.is-active {
  background: color-mix(in srgb, currentColor 16%, transparent);
  border-color: currentColor;
  box-shadow: inset 0 0 0 1px currentColor;
  font-weight: 600;
}

@media (max-width: 700px) {
  .u-carousel {
    --u-height: 58vh;
  }

  .u-carousel__arrow {
    width: 46px;
    height: 46px;
    font-size: 24px;
  }

  .u-carousel__bottom {
    flex-direction: column;
    align-items: stretch;
  }

  .u-carousel__counter {
    min-width: auto;
  }

  .u-carousel__iframe-wrap iframe {
    width: 100%;
    height: 100%;
  }
}
</style>

      }

      if (node.tagName === 'IFRAME') {
        node.setAttribute('loading', 'lazy');

        if (!node.hasAttribute('allowfullscreen')) {
          node.setAttribute('allowfullscreen', '');
        }

        if (!node.hasAttribute('referrerpolicy')) {
          node.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        }

        if (!node.hasAttribute('allow')) {
          node.setAttribute('allow', 'autoplay; fullscreen');
        }
      }

      unloadMedia(node);
    });
  }

  function buildCarousel(root) {
    if (root.dataset.uCarouselReady === 'true') return;

    var sourceNodes = Array.from(root.children).filter(isMedia);
    if (!sourceNodes.length) return;

    var mediaNodes = sourceNodes;

    prepareMedia(mediaNodes);

    root.replaceChildren();

    var viewer = document.createElement('div');
    viewer.className = 'u-carousel__viewer';

    var stage = document.createElement('div');
    stage.className = 'u-carousel__stage';

    var prev = document.createElement('button');
    prev.type = 'button';
    prev.className = 'u-carousel__arrow u-carousel__arrow--prev';
    prev.setAttribute('aria-label', 'Previous slide');
    prev.textContent = '‹';

    var next = document.createElement('button');
    next.type = 'button';
    next.className = 'u-carousel__arrow u-carousel__arrow--next';
    next.setAttribute('aria-label', 'Next slide');
    next.textContent = '›';

    var caption = document.createElement('div');
    caption.className = 'u-carousel__caption';

    var bottom = document.createElement('div');
    bottom.className = 'u-carousel__bottom';

    var counter = document.createElement('div');
    counter.className = 'u-carousel__counter';

    var thumbs = document.createElement('div');
    thumbs.className = 'u-carousel__thumbs';

    var items = mediaNodes.map(function (node, i) {
      var item = document.createElement('div');
      item.className = 'u-carousel__item';

      if (node.tagName === 'IFRAME') {
        var wrap = document.createElement('div');
        wrap.className = 'u-carousel__iframe-wrap';
        wrap.appendChild(node);
        item.appendChild(wrap);
      } else {
        item.appendChild(node);
      }

      stage.appendChild(item);

      var thumb = document.createElement('button');
      thumb.type = 'button';
      thumb.className = 'u-carousel__thumb';

      if (node.tagName === 'VIDEO') {
        thumb.textContent = '▶ ' + (i + 1);
      } else if (node.tagName === 'IFRAME') {
        thumb.textContent = '▣ ' + (i + 1);
      } else {
        thumb.textContent = String(i + 1);
      }

      thumbs.appendChild(thumb);

      return {
        wrap: item,
        media: node,
        thumb: thumb,
        caption: node.dataset.caption || '',
        captionHtml: node.dataset.captionHtml || ''
      };
    });

    viewer.appendChild(prev);
    viewer.appendChild(stage);
    viewer.appendChild(next);

    bottom.appendChild(counter);
    bottom.appendChild(thumbs);

    root.appendChild(viewer);
    root.appendChild(caption);
    root.appendChild(bottom);

    var index = 0;

    function update() {
      var near = root.dataset.uNearViewport === 'true' || isNearViewport(root);

      items.forEach(function (item, i) {
        var active = i === index;

        item.wrap.classList.toggle('is-active', active);
        item.thumb.classList.toggle('is-active', active);
      });

      items.forEach(function (item, i) {
        var media = item.media;
        var active = i === index;
        var shouldLoad = false;

        if (near && active) {
          shouldLoad = true;
        }

        if (
          near &&
          media.tagName === 'IMG' &&
          Math.abs(i - index) <= IMAGE_PRELOAD_RADIUS
        ) {
          shouldLoad = true;
        }

        if (shouldLoad) {
          loadMedia(media, active);
        } else {
          unloadMedia(media);
        }
      });

      counter.textContent = (index + 1) + ' / ' + items.length;

      if (items[index].captionHtml) {
        caption.innerHTML = items[index].captionHtml;
      } else {
        caption.textContent = items[index].caption || '';
      }
    }

    items.forEach(function (item, i) {
      item.thumb.addEventListener('click', function () {
        index = i;
        update();
      });
    });

    prev.addEventListener('click', function () {
      index = (index - 1 + items.length) % items.length;
      update();
    });

    next.addEventListener('click', function () {
      index = (index + 1) % items.length;
      update();
    });

    root.tabIndex = 0;

    root.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        index = (index - 1 + items.length) % items.length;
        update();
      }

      if (e.key === 'ArrowRight') {
        e.preventDefault();
        index = (index + 1) % items.length;
        update();
      }
    });

    if ('IntersectionObserver' in window) {
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          root.dataset.uNearViewport = entry.isIntersecting ? 'true' : 'false';
          update();
        });
      }, {
        root: null,
        rootMargin: PRELOAD_MARGIN + 'px 0px',
        threshold: 0
      });

      observer.observe(root);
    } else {
      root.dataset.uNearViewport = 'true';
    }

    root.dataset.uCarouselReady = 'true';
    update();
  }

  function prepareAudioPlayers() {
    document.querySelectorAll('audio').forEach(function (audio) {
      function warmupAudio() {
        if (audio.dataset.uAudioWarmup === 'true') return;

        audio.preload = 'metadata';
        audio.load();
        audio.dataset.uAudioWarmup = 'true';
      }

      audio.addEventListener('pointerenter', warmupAudio, { once: true });
      audio.addEventListener('focus', warmupAudio, { once: true });
      audio.addEventListener('touchstart', warmupAudio, { once: true, passive: true });

      audio.addEventListener('play', function () {
        document.querySelectorAll('video').forEach(function (video) {
          if (!video.paused) {
            video.pause();
          }
        });
      });
    });
  }

  function initAll() {
    document.querySelectorAll('[data-u-carousel]').forEach(buildCarousel);
    prepareAudioPlayers();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initAll);
  } else {
    initAll();
  }
})();
</script>

</body>
</html>
